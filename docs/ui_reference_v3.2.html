<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>운수종사자 일상점검 - 완전형 HTML 데모 v3.2</title>
  
  <style>

:root{
  --bg:#f4f6fa; --card:#ffffff; --text:#182230; --muted:#667085; --line:#e4e7ec;
  --primary:#4f46e5; --primary-dark:#4338ca; --primary-soft:#eef2ff;
  --ok:#16803d; --ok-soft:#ecfdf3; --warn:#c2410c; --warn-soft:#fff7ed;
  --bad:#b42318; --bad-soft:#fef3f2; --purple:#7e22ce; --purple-soft:#f3e8ff;
  --blue:#175cd3; --blue-soft:#eff8ff; --shadow:0 12px 34px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR","Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.demo-bar{background:#101828;color:#fff;text-align:center;padding:7px 12px;font-size:12px}
.app-header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1320px;margin:auto;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;gap:9px;align-items:center}.brand b{display:block}.brand small{display:block;color:var(--muted);font-size:11px}.truck-mark{font-size:28px}
.mode-tabs{background:var(--primary-soft);padding:4px;border-radius:14px;display:flex;gap:4px}
.mode-tabs button{border:0;background:transparent;color:#475467;font-weight:800;padding:9px 15px;border-radius:10px}
.mode-tabs button.active{background:white;color:var(--primary);box-shadow:0 2px 9px rgba(79,70,229,.15)}
.app-shell{max-width:1320px;margin:auto;padding:22px}
.driver-shell{max-width:570px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.card-pad{padding:21px}
.hero{background:linear-gradient(135deg,#eef2ff 0%,#fff 68%)}
h1,h2,h3,p{margin-top:0}h1{font-size:27px;line-height:1.28;margin-bottom:9px}h2{font-size:21px;margin-bottom:9px}h3{font-size:17px;margin-bottom:8px}
.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}.section{margin-top:16px}
.row{display:flex;gap:10px;align-items:center}.between{display:flex;gap:12px;justify-content:space-between;align-items:center}
.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:14px 15px;border:1.5px solid #d0d5dd;border-radius:13px;background:white;outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#8b5cf6;box-shadow:0 0 0 4px #ede9fe}
.btn{border:0;border-radius:14px;min-height:50px;padding:13px 16px;font-weight:850}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-soft{background:var(--primary-soft);color:#3730a3}.btn-ghost{background:#fff;border:1px solid var(--line);color:#344054}
.btn-ok{background:var(--ok);color:white}.btn-warn{background:#ea580c;color:white}.btn-danger{background:var(--bad);color:white}.btn-full{width:100%}
.btn-sm{min-height:auto;padding:8px 11px;border-radius:10px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.purple{background:var(--purple-soft);color:var(--purple)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}.pill.gray{background:#f2f4f7;color:#475467}
.notice,.success,.danger,.info{padding:13px 14px;border-radius:14px;line-height:1.45}
.notice{background:var(--warn-soft);border:1px solid #fed7aa}.success{background:var(--ok-soft);border:1px solid #bbf7d0}
.danger{background:var(--bad-soft);border:1px solid #fecaca}.info{background:var(--blue-soft);border:1px solid #b2ddff}
.driver-vehicle{display:flex;align-items:center;gap:10px}.truck-svg{width:118px;flex:0 0 auto}
.big-action{min-height:72px;font-size:19px}
.check-groups{display:grid;gap:13px}.check-group{border:1px solid var(--line);border-radius:15px;overflow:hidden}
.group-title{padding:10px 13px;background:#f8fafc;font-weight:900}.check-item{padding:12px 13px;border-top:1px solid #edf0f3;display:flex;gap:9px;align-items:flex-start}
.check-item:first-child{border-top:0}.check-item input{margin-top:4px;transform:scale(1.25)}
.complete-hero{text-align:center;padding:26px}.complete-icon{font-size:62px;color:var(--ok)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-head{text-align:center;color:var(--muted);font-size:12px;font-weight:900;padding:6px 0}
.cal-day{min-height:54px;border:1px solid #edf0f3;background:#fafafa;border-radius:10px;padding:7px 2px;text-align:center;font-size:12px}
.cal-day.clickable{cursor:pointer}.cal-day.clickable:hover{background:#eef2ff}.cal-day b{display:block}
.cal-mark{display:block;font-size:11px;font-weight:900;margin-top:4px}.cal-day.ok .cal-mark{color:var(--ok)}.cal-day.bad .cal-mark{color:var(--bad)}
.cal-day.warn .cal-mark{color:#ea580c}.cal-day.purple .cal-mark{color:var(--purple)}.cal-day.gray .cal-mark{color:#64748b}
.legend{display:flex;gap:7px;flex-wrap:wrap}
.summary-mini{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.summary-mini .mini{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:white}.mini b{display:block;font-size:20px}
.admin-login{max-width:430px;margin:50px auto}
.admin-layout{display:grid;grid-template-columns:230px 1fr;gap:18px}
.admin-side{padding:13px;height:fit-content;position:sticky;top:80px}.admin-side button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;font-weight:800;color:#475467}
.admin-side button.active{background:var(--primary-soft);color:var(--primary)}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;cursor:pointer}
.metric:hover{border-color:#c7d2fe}.metric span{color:var(--muted);font-size:12px}.metric b{display:block;font-size:28px;margin-top:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:white}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:white}
.data-table{border-collapse:collapse;width:100%}.data-table th,.data-table td{padding:11px 13px;border-bottom:1px solid #edf0f3;text-align:left;white-space:nowrap}
.data-table th{font-size:12px;color:var(--muted);background:#f8fafc}.data-table tr:hover td{background:#fafaff}
.link-btn{border:0;background:transparent;color:var(--primary);font-weight:900;padding:0}
.admin-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.audit-row{padding:12px 0;border-bottom:1px solid #edf0f3}.audit-row:last-child{border-bottom:0}
.import-row{display:grid;grid-template-columns:65px 1fr 110px 1fr 90px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f3}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.48);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-panel{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:21px;box-shadow:0 30px 80px rgba(0,0,0,.24)}
.modal-header{position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid var(--line);padding:16px 19px;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:19px}.icon-button{border:0;background:#f2f4f7;width:36px;height:36px;border-radius:10px}
.print-root{display:none}
.legal-screen{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;overflow:auto}
.legal-paper{background:white;color:#000;width:297mm;min-height:190mm;padding:7mm;margin:auto;font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
.legal-note{font-size:10pt;margin-bottom:2mm}.legal-title{text-align:center;font-size:16pt;font-weight:700;margin:0 0 4mm}
.legal-meta,.legal-table{border-collapse:collapse;width:100%;table-layout:fixed}
.legal-meta th,.legal-meta td,.legal-table th,.legal-table td{border:1px solid #000;color:#000}
.legal-meta th{font-size:8.5pt;padding:2mm 1mm;background:#fff}.legal-meta td{font-size:9pt;padding:2mm 1mm;text-align:center}
.legal-table th,.legal-table td{font-size:6.3pt;padding:1.1mm .4mm;text-align:center;vertical-align:middle}
.legal-table .item-col{text-align:left;padding-left:1.5mm;font-size:7.2pt;line-height:1.25}
.legal-table .category{width:8mm;font-weight:700;font-size:7.5pt;writing-mode:vertical-rl;letter-spacing:1px}
.legal-table .item-name{width:47mm}.legal-table .day-col{width:6.3mm}.legal-table .result-title{font-size:8.5pt;padding:1.8mm}
.legal-table .sign-label,.legal-table .action-label{font-weight:700;font-size:8pt;text-align:center}
.legal-table .action-text{text-align:left;padding:2mm;font-size:8pt}
.legal-table .symbol{font-size:9pt;font-weight:700}.source-link{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:980px){.admin-layout{grid-template-columns:1fr}.admin-side{position:static;display:flex;overflow:auto}.admin-side button{width:auto;white-space:nowrap}.metric-grid{grid-template-columns:repeat(2,1fr)}.admin-detail-grid{grid-template-columns:1fr}}
@media(max-width:620px){.app-shell{padding:13px}.brand small{display:none}.mode-tabs button{padding:8px 10px}.metric-grid{grid-template-columns:repeat(2,1fr)}.summary-mini{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}h1{font-size:24px}}
@page{size:A4 landscape;margin:7mm}
@media print{
  html,body{background:#fff}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  .legal-paper{width:auto;min-height:0;padding:0;margin:0}
  .source-link{display:none}
}

/* v3.2 회원정보/트럭 개선 */
.truck-photo-wrap{
  width:190px; height:112px; overflow:hidden; border-radius:18px;
  background:linear-gradient(180deg,#f2f8ff,#eef6f0);
  box-shadow:0 7px 22px rgba(16,24,40,.10); flex:0 0 auto;
}
.truck-photo{width:100%;height:100%;object-fit:cover;object-position:center 55%;display:block}
.member-info-card{
  background:rgba(255,255,255,.94);border:1px solid #e7eaf0;border-radius:18px;
  padding:14px 16px;box-shadow:0 5px 18px rgba(16,24,40,.05)
}
.member-info-title{display:flex;gap:8px;align-items:center;font-size:17px;margin-bottom:7px}
.info-line{display:grid;grid-template-columns:125px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid #edf0f3}
.info-line:last-child{border-bottom:0}.info-line span{color:#667085}.info-line b{color:#101828;word-break:keep-all}
.admin-only-card{background:#fff5f5;border:1px solid #fecaca;border-radius:18px;padding:14px 16px}
.admin-only-title{font-weight:900;color:#9f1239;margin-bottom:7px}
.admin-only-title span{font-size:11px;font-weight:700;color:#9f7aea;margin-left:7px}
@media(max-width:620px){
  .truck-photo-wrap{width:140px;height:88px}
  .info-line{grid-template-columns:105px 1fr}
}

</style>
</head>
<body>
  <div class="demo-bar">완전형 HTML 데모 v3.2 · 실제 서버 없이 브라우저 localStorage로 동작</div>

  <header class="app-header no-print">
    <div class="header-inner">
      <div class="brand">
        <span class="truck-mark">🚚</span>
        <div>
          <b>운수종사자 일상점검</b>
          <small>1.5t 이하 카고트럭</small>
        </div>
      </div>
      <div class="mode-tabs">
        <button id="driverModeBtn" class="active">기사 앱</button>

  <main id="app" class="app-shell"></main>

  <div id="modal" class="modal hidden no-print" role="dialog" aria-modal="true">
    <div class="modal-panel">
      <div class="modal-header">
        <b id="modalTitle">상세</b>
        <button id="modalClose" class="icon-button">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <section id="printRoot" class="print-root"></section>

  <script>

(() => {
  "use strict";
  const $=(s,r=document)=>r.querySelector(s);
  const $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const KEY="gwyongdal_complete_demo_v3";
  const ADMIN_KEY="gwyongdal_admin_demo_session";
  const TODAY=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());

  const fmt=s=>{const [y,m,d]=s.split("-");return `${y}년 ${Number(m)}월 ${Number(d)}일`};
  const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const now=()=>new Date().toISOString();

  const monthKey=()=>TODAY().slice(0,7);

  const ITEMS=[
    {group:"외관점검",code:"EXT01",label:"번호판, 전면유리, 후사경 등의 청결상태"},
    {group:"외관점검",code:"EXT02",label:"후미등, 차폭등 등 등화장치 작동상태"},
    {group:"외관점검",code:"EXT03",label:"창닦이기 작동상태"},
    {group:"외관점검",code:"EXT04",label:"적재함(보조지지대 포함), 측면 보호대, 후부반사판, 트레일러 연결장치의 부착 상태 및 훼손 여부"},
    {group:"상태점검",code:"COND01",label:"타이어 손상 및 마모(1.6mm이상) 여부"},
    {group:"상태점검",code:"COND02",label:"화물, 적재함 지지대(판스프링) 등의 고정상태"},
    {group:"상태점검",code:"COND03",label:"바퀴 너트 등 균열 여부"},
    {group:"기타",code:"ETC01",label:"냉각수, 공기압, 엔진오일 등 차량 이상 여부(계기판 확인)"},
    {group:"기타",code:"ETC02",label:"좌석안전띠 상태"},

    {group:"기타",code:"ETC04",label:"안전삼각대 등 비치 여부"}

  const DEMO_MEMBER={id:1,memberNo:"M0001",qualificationCertificateNo:"11-2020-012345",name:"홍길동",vehicle:"강원81자1234호",vehicleType:"1.5톤 카고(화물)",phone:"010-1234-5678",address:"강원특별자치도 춘천시 중앙로 100",businessName:"홍길동",active:true,joined:false,trackingStart:null,pinState:"unregistered"};
  const SAMPLE_MEMBERS=[
    DEMO_MEMBER,
    {id:2,memberNo:"M0002",name:"김철수",vehicle:"강원82자5678호",phone:"010-2345-6789",address:"강원특별자치도 원주시 무실로 12",businessName:"김철수",active:true,joined:true,trackingStart:shift(TODAY(),-20),pinState:"active"},
    {id:3,memberNo:"M0003",name:"박영수",vehicle:"강원80바9012호",phone:"010-3456-7890",address:"강원특별자치도 강릉시 경강로 10",businessName:"박영수",active:true,joined:true,trackingStart:shift(TODAY(),-20),pinState:"active"},
    {id:4,memberNo:"M0004",name:"이성호",vehicle:"강원83자3456호",phone:"010-4567-8901",address:"강원특별자치도 춘천시 후평로 45",businessName:"이성호",active:true,joined:true,trackingStart:shift(TODAY(),-20),pinState:"active"},
    {id:5,memberNo:"M0005",name:"최민수",vehicle:"강원84자7788호",phone:"010-5678-9012",address:"강원특별자치도 홍천군 홍천읍 77",businessName:"최민수",active:true,joined:true,trackingStart:shift(TODAY(),-20),pinState:"active"},
    {id:6,memberNo:"M0006",qualificationCertificateNo:"11-2026-000006",name:"정우진",vehicle:"강원85자1122호",vehicleType:"1.5톤 카고(화물)",phone:"010-6789-0123",address:"강원특별자치도 횡성군 횡성읍 21",businessName:"정우진",active:true,joined:false,trackingStart:null,pinState:"unregistered"},
    {id:7,memberNo:"M0007",name:"장태호",vehicle:"강원86자2233호",phone:"010-7000-1001",address:"강원특별자치도 속초시 중앙로 8",businessName:"장태호",active:true,joined:true,trackingStart:shift(TODAY(),-20),pinState:"active"},

  function blankState(){
    const members=JSON.parse(JSON.stringify(SAMPLE_MEMBERS));
    const inspections={}; members.forEach(m=>inspections[m.id]={});
    const st={
      mode:"driver",
      driver:{registered:false,step:"lookup",memberId:1,loggedIn:true,deviceTrusted:false,pin:"",completionDate:null},

      complianceEvents:[],

        {id:2,login:"staff",name:"협회직원",role:"staff",totp:true,active:true},
        {id:3,login:"viewer",name:"조회전용",role:"read_only",totp:false,active:true}
      ],
      adminSession:null
    };
    seedOtherMembers(st);
    return st;
  }

  function seedOtherMembers(st){
    const t=TODAY();
    const mk=t.slice(0,7);
    const set=(id,date,status,late=false,issues=[])=>st.inspections[id][date]={status,late,issues,time:"08:10",enteredAt:now(),entryChannel:"driver",revisions:1};

  function badge(s){
    if(s==="완료"||s==="정상")return`<span class="pill ok">${esc(s)}</span>`;
    if(s.includes("이상"))return`<span class="pill warn">${esc(s)}</span>`;
    if(s.includes("지연"))return`<span class="pill purple">${esc(s)}</span>`;
    if(s.includes("미등록")||s.includes("점검안함"))return`<span class="pill bad">${esc(s)}</span>`;
    if(s==="앱 미가입")return`<span class="pill blue">${esc(s)}</span>`;
    return`<span class="pill gray">${esc(s)}</span>`;
  }

  function statusOf(memberId,date){
    const r=recs(memberId)[date];
    if(r){
      if(r.status==="normal") return r.late?"정상·지연":"완료";
      if(r.status==="not_driving") return r.late?"미운행·지연":"미운행";
      if(r.status==="issue") return r.late?"이상·지연":"이상";
    }
    if(activeEvent(memberId,date,"inspection_not_performed")) return "점검안함 확인";
    const m=member(memberId);
    if(!m?.joined) return "앱 미가입";
    if(!m?.trackingStart || date<m.trackingStart) return "대상아님";
    return date<=TODAY()?"점검 미등록":"";
  }

  function missingDates(memberId,limit=999){
    const m=member(memberId); if(!m?.joined||!m.trackingStart)return[];
    const out=[]; let d=shift(TODAY(),-1), count=0;
    while(d>=m.trackingStart && count<400){
      if(!recs(memberId)[d] && !activeEvent(memberId,d,"inspection_not_performed")) out.push(d);
      d=shift(d,-1);count++;
    }
    return out.slice(0,limit);
  }

  function groupsHtml(withChecks=false){
    const groups=["외관점검","상태점검","기타"];
    return `<div class="check-groups">${groups.map(g=>`
      <div class="check-group"><div class="group-title">${g}</div>
      ${ITEMS.map((it,i)=>({it,i})).filter(x=>x.it.group===g).map(({it,i})=>`
        <label class="check-item">${withChecks?`<input type="checkbox" class="issue-check" value="${i}">`:`<b>${i+1}.</b>`}<span>${esc(it.label)}</span></label>`).join("")}
      </div>`).join("")}</div>`;
  }

  function setMode(mode){
    S.mode=mode;save();
    $("#driverModeBtn").classList.toggle("active",mode==="driver");
    $("#adminModeBtn").classList.toggle("active",mode==="admin");
    if(mode==="driver")renderDriver();else renderAdmin();
  }

  /* DRIVER */
  function renderDriver(){
    $("#app").className="app-shell";
    const m=driverMember();
    if(!S.driver.registered){
      if(S.driver.step==="lookup")return renderLookup();
      if(S.driver.step==="address")return renderAddressConfirm();
      if(S.driver.step==="pin")return renderPinSetup();
    }
    if(!S.driver.loggedIn)return renderDriverLogin();
    if(S.driver.completionDate===TODAY())return renderCompletion();
    renderDriverHome();
  }

  function monthSummary(memberId,y,m){
    const prefix=`${y}-${String(m).padStart(2,"0")}`,days=new Date(y,m,0).getDate();
    let normal=0,off=0,issue=0,late=0,missing=0;
    for(let d=1;d<=days;d++){
      const ds=`${prefix}-${String(d).padStart(2,"0")}`; if(ds>TODAY())continue;
      const r=recs(memberId)[ds]; if(r){if(r.status==="normal")normal++;if(r.status==="not_driving")off++;if(r.status==="issue")issue++;if(r.late)late++}
      else if(statusOf(memberId,ds)==="점검 미등록")missing++;
    }
    return{normal,off,issue,late,missing};
  }

  function calendarHtml(memberId,y,m,admin=false){
    const days=new Date(y,m,0).getDate(),first=new Date(y,m-1,1).getDay();
    let html=["일","월","화","수","목","금","토"].map(x=>`<div class="cal-head">${x}</div>`).join("");
    for(let i=0;i<first;i++)html+="<div></div>";
    for(let d=1;d<=days;d++){
      const ds=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`,s=statusOf(memberId,ds);
      let cls="",mark="";
      if(s==="완료"){cls="ok";mark="✓"} else if(s==="미운행"){cls="gray";mark="미"} else if(s.includes("지연")){cls="purple";mark=s.includes("미운행")?"미·지연":"지연"}
      else if(s.includes("이상")){cls="warn";mark="이상"} else if(s==="점검 미등록"){cls="bad";mark="미등록"} else if(s==="점검안함 확인"){cls="bad";mark="점검안함"}
      html+=`<div class="cal-day ${cls} ${ds<=TODAY()?"clickable":""}" ${ds<=TODAY()?`data-act="${admin?"admin-day":"calendar-day"}" data-member="${memberId}" data-date="${ds}"`:""}><b>${d}</b><span class="cal-mark">${mark}</span></div>`;
    }
    return html;
  }

  function legalHtml(memberId,ym){
    const m=member(memberId),[y,mo]=ym.split("-").map(Number),days=new Date(y,mo,0).getDate();
    const dayHeaders=Array.from({length:31},(_,i)=>`<th class="day-col">${i+1}</th>`).join("");
    const groups=["외관점검","상태점검","기타"];
    let rows="";
    for(const g of groups){
      const entries=ITEMS.map((it,i)=>({it,i})).filter(x=>x.it.group===g);
      entries.forEach(({it,i},idx)=>{
        rows+=`<tr>${idx===0?`<td class="category" rowspan="${entries.length}">${g}</td>`:""}<td class="item-col">${esc(it.label)}</td>`;
        for(let d=1;d<=31;d++){
          const date=`${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
          rows+=`<td class="symbol">${d<=days?legalCell(memberId,date,i):""}</td>`;
        }
        rows+="</tr>";
      });
    }
    let sign=`<tr><td class="sign-label" colspan="2">점검자 확인(서명)</td>`;
    for(let d=1;d<=31;d++){
      const date=`${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`,r=recs(memberId)[date];
      sign+=`<td>${r?"홍":""}</td>`;
    }
    sign+="</tr>";
    const actionNotes=[];
    for(let d=1;d<=days;d++){
      const date=`${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`,r=recs(memberId)[date];
      if(r?.status==="issue")for(const it of r.issues) actionNotes.push(`${d}일 ${ITEMS[it.idx].label} - ${it.note||"조치내용 확인"}`);
    }
    return `<div class="legal-paper">
      <div class="legal-note">■ 화물자동차 운수사업법 시행규칙 [별지 제14호의5서식] &lt;신설 2025. 12. 29.&gt; &nbsp; [시행일: 2026. 6. 30.]</div>
      <div class="legal-title">운수종사자 일상점검표</div>
      <table class="legal-meta"><tr>
        <th style="width:13%">점검연월</th><td style="width:15%">${y}년 ${mo}월</td>
        <th style="width:13%">운송사업자명</th><td style="width:19%">${esc(m.businessName||m.name)}</td>
        <th style="width:12%">차량번호</th><td style="width:14%">${esc(m.vehicle)}</td>
        <th style="width:12%">운수종사자명</th><td style="width:14%">${esc(m.name)}</td>
      </tr></table>
      <table class="legal-table" style="margin-top:3mm">
        <colgroup><col style="width:8mm"><col style="width:47mm">${Array.from({length:31},()=>'<col style="width:6.3mm">').join("")}</colgroup>
        <tr><th colspan="2" rowspan="2">점검항목</th><th class="result-title" colspan="31">점검결과(양호 ○, 불량 ×, 미운행시 “미” 기입)</th></tr>
        <tr>${dayHeaders}</tr>
        ${rows}${sign}
        <tr><td class="action-label" colspan="2">불량상태 조치 기록</td><td class="action-text" colspan="31">${actionNotes.length?actionNotes.map(esc).join(" / "):"(예시) 00일 창닦이기 불량 - 00일 창닦이기 교체"}</td></tr>
      </table>
    </div>`;
  }

  function openModal(title,html){$("#modalTitle").textContent=title;$("#modalBody").innerHTML=html;$("#modal").classList.remove("hidden")}
  function closeModal(){$("#modal").classList.add("hidden")}

  /* ACTIONS */
  document.addEventListener("click",e=>{
    const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
    if(a==="demo-fill"){$("#lookupVehicle").value="강원81자1234호";$("#lookupName").value="홍길동"}
    else if(a==="lookup"){if($("#lookupVehicle").value.replace(/\s/g,"")==="강원81자1234호"&&$("#lookupName").value.trim()==="홍길동"){S.driver.step="address";save();renderDriver()}else alert("데모에서는 홍길동 / 강원81자1234호를 입력해 주세요.")}
    else if(a==="lookup-back"){S.driver.step="lookup";save();renderDriver()}
    else if(a==="address-ok"){S.driver.step="pin";save();renderDriver()}
    else if(a==="address-change"){const m=driverMember();openModal("주소 변경 요청",`<div class="info">현재 주소<br><b>${esc(m.address)}</b></div><div class="field"><label>새 주소</label><input id="newAddress"></div><button class="btn btn-primary btn-full" data-act="address-request-save">변경 요청</button>`)}
    else if(a==="address-request-save"){const v=$("#newAddress").value.trim();if(!v)return alert("새 주소를 입력해 주세요.");const m=driverMember();S.addressRequests.push({id:Date.now(),memberId:m.id,oldValue:m.address,newValue:v,status:"pending",requestedAt:now()});if(!S.driver.registered)S.driver.step="pin";save();closeModal();renderDriver()}
    else if(a==="pin-save"){const p1=$("#pin1").value,p2=$("#pin2").value;if(!/^\d{4}$/.test(p1)||p1!==p2)return alert("같은 숫자 4자리를 입력해 주세요.");const m=driverMember();m.joined=true;m.trackingStart=TODAY();m.pinState="active";S.driver.registered=true;S.driver.loggedIn=true;S.driver.deviceTrusted=true;S.driver.pin=p1;save();renderDriver()}
    else if(a==="driver-login"){const m=driverMember();if($("#loginVehicle").value.replace(/\s/g,"")!==m.vehicle.replace(/\s/g,"")||$("#loginPin").value!==S.driver.pin)return alert("차량번호 또는 PIN이 올바르지 않습니다.");S.driver.loggedIn=true;save();renderDriver()}
    else if(a==="reset-pin-driver"){openModal("새 PIN 설정",`<div class="field"><label>새 PIN</label><input id="resetPin1" maxlength="4" inputmode="numeric" type="password"></div><div class="field"><label>확인</label><input id="resetPin2" maxlength="4" inputmode="numeric" type="password"></div><button class="btn btn-primary btn-full" data-act="reset-pin-driver-save">저장</button>`)}
    else if(a==="reset-pin-driver-save"){const p1=$("#resetPin1").value,p2=$("#resetPin2").value;if(!/^\d{4}$/.test(p1)||p1!==p2)return alert("같은 숫자 4자리를 입력해 주세요.");const m=driverMember();S.driver.pin=p1;m.pinState="active";S.driver.loggedIn=true;S.driver.deviceTrusted=true;save();closeModal();renderDriver()}
    else if(a==="driver-logout"){S.driver.loggedIn=false;save();closeModal();renderDriver()}
    else if(a==="inspect"){closeModal();showInspection(b.dataset.date)}
    else if(a==="issue-start"){showIssue(b.dataset.date)}
    else if(a==="issue-save"){const ids=$$(".issue-check:checked").map(x=>Number(x.value));if(!ids.length)return alert("불량 항목을 하나 이상 선택해 주세요.");const note=$("#issueNote").value.trim();saveInspection(b.dataset.date,"issue",ids.map(idx=>({idx,note})))}
    else if(a==="save-inspection"){saveInspection(b.dataset.date,b.dataset.status)}
    else if(a==="completion-home"){S.driver.completionDate=null;save();renderDriver()}
    else if(a==="missing-day"){showMissingDay(b.dataset.date)}
    else if(a==="missing-all"){showMissingAll()}
    else if(a==="not-performed"){const m=driverMember(),date=b.dataset.date;if(activeEvent(m.id,date,"inspection_not_performed"))return;S.complianceEvents.push({id:Date.now(),memberId:m.id,date,type:"inspection_not_performed",at:now(),actor:"driver"});save();closeModal();renderDriver()}
    else if(a==="record"){showRecord(driverMember().id,b.dataset.date,false)}
    else if(a==="calendar-day"){const id=Number(b.dataset.member),d=b.dataset.date;if(recs(id)[d])showRecord(id,d,false);else showMissingDay(d)}
    else if(a==="monthly"){closeModal();showMonthly(driverMember().id,false)}
    else if(a==="calendar-refresh"){const ym=`${$("#calYear").value}-${String($("#calMonth").value).padStart(2,"0")}`;showMonthly(Number(b.dataset.member),b.dataset.admin==="1",ym)}
    else if(a==="profile"){showProfile()}
    else if(a==="seed-history"){
      const m=driverMember();m.trackingStart=shift(TODAY(),-20);const r=recs(m.id);for(let i=-20;i<=-1;i++){const d=shift(TODAY(),i);if(i%6===0)continue;if(i%7===0)r[d]={status:"not_driving",issues:[],late:false,time:"07:50",enteredAt:now(),entryChannel:"driver",revisions:1};else if(i%9===0)r[d]={status:"issue",issues:[{idx:2,note:"창닦이기 점검 후 교체"}],late:i%2===0,time:"08:05",enteredAt:now(),entryChannel:"driver",revisions:1};else r[d]={status:"normal",issues:[],late:i%5===0,time:"07:40",enteredAt:now(),entryChannel:"driver",revisions:1}}
      save();alert("데모용 과거 20일 기록을 생성했습니다.");renderDriver()
    }
    else if(a==="legal-form"){showLegal(Number(b.dataset.member||driverMember().id),b.dataset.ym||monthKey())}
    else if(a==="print-legal"){printLegal(Number(b.dataset.member),b.dataset.ym)}
    else if(a==="reset-demo"){if(confirm("모든 데모 데이터를 초기화할까요?")){localStorage.removeItem(KEY);sessionStorage.removeItem(ADMIN_KEY);location.reload()}}
    else if(a==="admin-login"){if($("#adminId").value==="admin"&&$("#adminPw").value==="1234"&&$("#adminTotp").value==="000000"){S.adminSession={id:1,name:"최고관리자",role:"super_admin",loginAt:now()};addAudit("관리자 로그인","admin","TOTP 인증 성공");save();renderAdmin()}else alert("데모 계정은 admin / 1234 / 000000 입니다.")}
    else if(a==="admin-logout"){addAudit("관리자 로그아웃","admin","세션 종료");S.adminSession=null;save();renderAdmin()}
    else if(a==="admin-nav"){renderAdminView(b.dataset.view)}
    else if(a==="dash-filter"){renderDashboard(b.dataset.filter)}
    else if(a==="admin-refresh"){renderDashboard()}
    else if(a==="member-detail"){showMemberDetail(Number(b.dataset.member))}
    else if(a==="admin-monthly"){closeModal();showMonthly(Number(b.dataset.member),true)}
    else if(a==="admin-missing-list"){showAdminMissingList(Number(b.dataset.member))}
    else if(a==="admin-day"){showAdminDay(Number(b.dataset.member),b.dataset.date)}
    else if(a==="record-admin"){showRecord(Number(b.dataset.member),b.dataset.date,true)}
    else if(a==="proxy-start"){showProxy(Number(b.dataset.member),b.dataset.date||TODAY())}
    else if(a==="proxy-save"){
      const id=Number(b.dataset.member),date=$("#proxyDate").value,status=$("#proxyStatus").value,method=$("#proxyMethod").value,reason=$("#proxyReason").value.trim();
      if(!reason)return alert("대리입력 사유/메모를 입력해 주세요.");if(date>TODAY())return alert("미래 날짜는 입력할 수 없습니다.");if(recs(id)[date])return alert("이미 기사/관리자 기록이 있어 덮어쓸 수 없습니다.");
      recs(id)[date]={status,issues:status==="issue"?[{idx:4,note:reason}]:[],late:date<TODAY(),time:time(),enteredAt:now(),entryChannel:"admin_proxy",proxyMethod:method,proxyReason:reason,revisions:1};
      addAudit("관리자 대리입력",`${member(id).name} ${date}`,`${status} · ${method} · ${reason}`);save();closeModal();renderAdminView("dashboard")
    }
    else if(a==="pin-reset-admin"){
      const id=Number(b.dataset.member),m=member(id);if(!confirm(`${m.name} 회원의 PIN을 초기화할까요?`))return;
      const before={pinState:m.pinState};m.pinState="reset_required";if(id===driverMember().id){S.driver.loggedIn=false;S.driver.deviceTrusted=false;S.driver.pin=""}
      addAudit("PIN 초기화",`${m.name} · ${m.vehicle}`,"기존 PIN 폐기 및 세션/신뢰기기 해제",before,{pinState:m.pinState});save();closeModal();renderAdminView("dashboard")
    }
    else if(a==="void-not-performed"||a==="void-not-performed-by-date"){
      let ev;if(a==="void-not-performed")ev=S.complianceEvents.find(x=>x.id===Number(b.dataset.event));else ev=activeEvent(Number(b.dataset.member),b.dataset.date,"inspection_not_performed");
      if(!ev)return;const reason=prompt("오입력 취소 사유를 입력하세요.");if(!reason)return;
      const voidEvent={id:Date.now(),memberId:ev.memberId,date:ev.date,type:"inspection_not_performed_voided",at:now(),actor:"admin",originalEventId:ev.id,reason};ev.voidedByEventId=voidEvent.id;S.complianceEvents.push(voidEvent);addAudit("점검안함 확인 취소",`${member(ev.memberId).name} ${ev.date}`,reason);save();closeModal();renderAdminView("dashboard")
    }
    else if(a==="change-approve"||a==="change-reject"){
      const req=S.addressRequests.find(x=>x.id===Number(b.dataset.id));if(!req)return;const m=member(req.memberId),before={address:m.address};
      if(a==="change-approve"){m.address=req.newValue;req.status="approved";addAudit("주소 변경 승인",`${m.name} · ${m.vehicle}`,"기사 주소변경 요청 승인",before,{address:m.address})}
      else{req.status="rejected";addAudit("주소 변경 반려",`${m.name} · ${m.vehicle}`,"기사 주소변경 요청 반려",before,before)}
      req.decidedAt=now();save();renderChangesAdmin()
    }
    else if(a==="import-preview"){
      const file=$("#importFile").files[0];if(!file)return alert("Excel/CSV 파일을 선택해 주세요.");const type=$("#importType").value;
      const batch={id:Date.now(),filename:file.name,type,status:"review",counts:{new:3,changed:2,status:type==="full_snapshot"?1:0,same:7,review:1},rows:[
        {kind:"신규",name:"신규회원A",vehicle:"강원92자1111호",diff:"신규 회원",decision:"반영"},
        {kind:"변경",name:"김철수",vehicle:"강원82자5678호",diff:"주소 변경",decision:"반영"},
        {kind:"변경",name:"박영수",vehicle:"강원80바9012호",diff:"전화번호 변경",decision:"반영"},
        {kind:"확인필요",name:"동명이인",vehicle:"강원99자9999호",diff:"관리번호 확인 필요",decision:"보류"},
        ...(type==="full_snapshot"?[{kind:"상태변경",name:"폐업후보",vehicle:"강원70자1010호",diff:"전체명부에 없음 → inactive 후보",decision:"검토"}]:[])
      ]};S.importBatches.unshift(batch);addAudit("회원명부 비교",file.name,`${type} 비교 미리보기`);save();$("#importPreview").innerHTML=importPreviewHtml(batch)
    }
    else if(a==="import-apply"){const batch=S.importBatches.find(x=>x.id===Number(b.dataset.id));if(!batch)return;batch.status="applied";batch.appliedAt=now();addAudit("회원명부 반영",batch.filename,`${batch.type} 차이 반영`);save();alert("데모: 검토된 차이만 반영 처리했습니다.");renderImportsAdmin()}
    else if(a==="lockout-release"){const l=S.lockouts.find(x=>x.id===Number(b.dataset.id));if(l)l.released=true;addAudit("로그인 잠금 해제","보안",`lockout ${b.dataset.id}`);save();renderSecurityAdmin()}
    else if(a==="settings-save"){
      const before=JSON.parse(JSON.stringify(S.settings));S.settings.lateEntryMode=$("#setLateMode").value;S.settings.lateEntryDays=$("#setLateDays").value?Number($("#setLateDays").value):null;S.settings.driverSameDayEdit=$("#setSameEdit").checked;S.settings.adminCorrection=$("#setAdminCorr").checked;S.settings.staffTotpRequired=$("#setStaffTotp").checked;S.settings.sessionTtlDays=Number($("#setTtl").value);S.settings.maxDevices=Number($("#setDevices").value);addAudit("시스템 설정 변경","system_settings","운영정책 변경",before,S.settings);save();alert("설정을 저장했습니다.");renderSettingsAdmin()
    }
    else if(a==="admin-form-open"){showLegal(Number($("#formMember").value),$("#formYm").value)}
  });

  document.addEventListener("input",e=>{
    if(e.target.id==="memberSearch"||e.target.id==="statusFilter"){
      const q=($("#memberSearch")?.value||"").toLowerCase(),f=$("#statusFilter")?.value||"";
      $$("#memberTableBody tr").forEach(tr=>{tr.style.display=(!q||tr.dataset.search.includes(q))&&(!f||tr.dataset.status.includes(f))?"":"none"})
    }
  });
  document.addEventListener("change",e=>{if(e.target.id==="statusFilter")e.target.dispatchEvent(new Event("input",{bubbles:true}))});

  $("#driverModeBtn").addEventListener("click",()=>setMode("driver"));
  $("#adminModeBtn").addEventListener("click",()=>setMode("admin"));
  $("#modalClose").addEventListener("click",closeModal);
  $("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

  setMode(S.mode||"driver");
})();

</script>
</body>
</html>
