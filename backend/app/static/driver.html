<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>운수종사자 일상점검</title>
  <link rel="stylesheet" href="/static/common.css">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body class="driver-page">
  <header class="app-header no-print">
    <div class="header-inner">
      <div class="brand">
        <span class="truck-mark">🚚</span>
        <div>
          <b>운수종사자 일상점검</b>
          <small>1.5t 이하 화물자동차</small>
        </div>
      </div>
      <div class="mode-tabs">
        <button class="active" type="button">기사 앱</button>
        <a href="/admin">협회 관리자</a>
      </div>
    </div>
  </header>

  <main id="app" class="app-shell"></main>

  <div id="modal" class="modal hidden no-print" role="dialog" aria-modal="true">
    <div class="modalpanel">
      <div class="modalhead">
        <b id="mtitle">상세</b>
        <button id="mclose" class="x" type="button">✕</button>
      </div>
      <div id="mbody" class="modalbody"></div>
    </div>
  </div>

  <script src="/static/driver.js"></script>
</body>
</html>
